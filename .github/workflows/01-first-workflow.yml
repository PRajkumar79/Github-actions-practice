
name: First GitHub Actions Workflow

on:
  workflow_dispatch:

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Welcome
        run: echo "Hello! My first GitHub Actions workflow"

      - name: Display Date
        run: date

      - name: Display Runner
        run: echo "Running on GitHub hosted runner"

      - name: Check OS
        run: uname -a
