
name: Conditions Demo

on:
  workflow_dispatch:

jobs:
  conditions-job:
    runs-on: ubuntu-latest

    steps:
      - name: Step 1 - Success
        run: echo "This step is successful"

      - name: Step 2 - Run on Success
        if: success()
        run: echo "Previous step succeeded"

      - name: Step 3 - Run Always
        if: always()
        run: echo "This step always runs"

      - name: Step 4 - Run on Failure
        if: failure()
        run: echo "Previous step failed"
