name: Ubuntu and Windows Matrix Demo

on:
  workflow_dispatch:

jobs:
  matrix-job:
    name: Run on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Display OS
        run: echo "Hello from ${{ matrix.os }}"

      - name: Display Message
        run: echo "Matrix job is successful!"
