
name: Senior DevOps CI Pipeline

on:
  workflow_dispatch:

jobs:

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: practice-cache.txt
          key: ${{ runner.os }}-practice-v1

      - name: Display Cache Status
        run: echo "Cache hit: ${{ steps.cache.outputs.cache-hit }}"

      - name: Run Tests
        run: echo "Tests passed on ${{ matrix.os }}"

      - name: Create Cache File
        run: echo "Practice data" > practice-cache.txt

  security-check:
    name: Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Run Security Check
        run: echo "Security check passed"

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [test, security-check]

    steps:
      - name: Build
        run: echo "Build completed successfully"

  failure-report:
    name: Failure Report
    runs-on: ubuntu-latest
    needs: [test, security-check, build]
    if: failure()

    steps:
      - name: Report Failure
        run: echo "Pipeline failed. Please investigate."
